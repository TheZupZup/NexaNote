name: Publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # EN: Compute the image tags. Every push gets `latest` and a `${sha}` tag
      #     under both the short (`nexanote`) and explicit (`nexanote-backend`)
      #     names — existing docs and the bundled docker-compose.yml reference
      #     the `-backend` variant while README points at the short one, so
      #     keeping both in sync avoids broken pull commands either way.
      #     A `vX.Y.Z` tag push additionally publishes the clean `X.Y.Z`
      #     version tag (the `v` is stripped), so one release tag drives the
      #     Docker version exactly like the APK and F-Droid metadata.
      # FR: Calcule les tags. Chaque push reçoit `latest` et `${sha}` sous les
      #     deux noms ; un tag `vX.Y.Z` ajoute en plus le tag de version `X.Y.Z`.
      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          tags=(
            "thezupzup/nexanote:latest"
            "thezupzup/nexanote:${GITHUB_SHA}"
            "thezupzup/nexanote-backend:latest"
            "thezupzup/nexanote-backend:${GITHUB_SHA}"
          )
          # On a vX.Y.Z tag, publish the clean X.Y.Z version tag too.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            tags+=("thezupzup/nexanote:${version}")
            tags+=("thezupzup/nexanote-backend:${version}")
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
