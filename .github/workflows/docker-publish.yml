name: Publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # EN: Publish under both the short (`nexanote`) and explicit
      #     (`nexanote-backend`) names. Existing docs and the bundled
      #     docker-compose.yml reference the `-backend` variant while
      #     README points at the short one — keeping both tags in sync
      #     avoids broken pull commands for users following either guide.
      # FR: Publie sous les deux noms (`nexanote` et `nexanote-backend`)
      #     pour qu'aucune des docs existantes ne pointe vers une image
      #     introuvable.
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            thezupzup/nexanote:latest
            thezupzup/nexanote:${{ github.sha }}
            thezupzup/nexanote-backend:latest
            thezupzup/nexanote-backend:${{ github.sha }}
