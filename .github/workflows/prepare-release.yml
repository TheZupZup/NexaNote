name: Prepare release

# Cut a NexaNote release from the GitHub web UI — no local checkout needed.
# Given a versionName (X.Y.Z) and versionCode, this workflow:
#   1. checks out main,
#   2. runs scripts/bump_version.py to update app/pubspec.yaml, the F-Droid
#      metadata, and CHANGELOG.md,
#   3. commits the bump as `chore: release vX.Y.Z` on a new `release/vX.Y.Z`
#      branch (github-actions[bot] author),
#   4. pushes that release branch, and
#   5. opens a pull request into main titled `chore: release vX.Y.Z` (or, if the
#      repository blocks Actions from creating PRs, prints a link to open it by
#      hand instead of failing the run — the branch is already pushed).
#
# It NEVER pushes to main directly — main is a protected branch, so the bump
# lands only when a maintainer merges the PR. It also no longer creates the
# `vX.Y.Z` tag here: the tag has to point at the commit that actually lands on
# main, which exists only after the merge (and may be a squash/rebase commit).
# After merging the release PR, tag the merge commit and push the tag:
#
#   git tag vX.Y.Z <merge-commit> && git push origin vX.Y.Z
#
# That tag is what drives publishing: android-release.yml builds and attaches
# the APK and docker-publish.yml publishes the Docker image when `vX.Y.Z`
# appears.
#
# Triggering CI on the PR: anything created or pushed with the default
# GITHUB_TOKEN does NOT start other workflow runs (GitHub blocks recursive
# triggers). So for this release PR to auto-run the pull_request checks
# (python-app.yml), add a repository secret named RELEASE_PAT — a PAT (or
# GitHub App token) with `contents: write` and `pull-requests: write` — which
# is used when set. Without it the branch, commit, and PR still succeed; the
# PR's checks just won't run until the branch is pushed to again.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName — semver X.Y.Z, e.g. 1.1.0"
        required: true
        type: string
      version_code:
        description: "versionCode — monotonic integer, e.g. 4"
        required: true
        type: string

# Never let two release-prep runs race on the same release branch / PR.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    # Pass inputs through the environment rather than interpolating them into
    # run scripts, so a value like `$(...)` can never be shell-injected.
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_name must look like X.Y.Z (got '${VERSION_NAME}')."
            exit 1
          fi
          if [[ ! "${VERSION_CODE}" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code must be a positive integer (got '${VERSION_CODE}')."
            exit 1
          fi
          echo "TAG=v${VERSION_NAME}" >> "${GITHUB_ENV}"
          echo "RELEASE_BRANCH=release/v${VERSION_NAME}" >> "${GITHUB_ENV}"
          echo "Preparing release v${VERSION_NAME} (versionCode ${VERSION_CODE})."

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history + tags so the "tag already exists" check is reliable.
          fetch-depth: 0
          # Prefer a PAT/App token so the release PR can trigger the
          # pull_request checks; fall back to GITHUB_TOKEN otherwise.
          token: ${{ secrets.RELEASE_PAT || github.token }}
          persist-credentials: true

      - name: Fail if tag already exists
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists locally. Choose a new version."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin. Choose a new version."
            exit 1
          fi
          echo "Tag ${TAG} is available."

      - name: Fail if working tree is dirty
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree has unexpected changes before the bump:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree is clean."

      - name: Bump version
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bump_version.py "${VERSION_NAME}" "${VERSION_CODE}"

      - name: Verify the bump produced changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "::error::scripts/bump_version.py produced no changes — nothing to release."
            exit 1
          fi
          echo "Files changed by the bump:"
          git status --porcelain

      - name: Commit the bump on a release branch and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Start the release branch from the checked-out main. -C resets it if a
          # previous run left one behind, so re-runs regenerate a clean bump.
          git switch -C "${RELEASE_BRANCH}"
          git add -A
          git commit -m "chore: release ${TAG}"
          # Force-push: the release/* branch is owned entirely by this workflow
          # and guarded by the concurrency group, so overwriting a stale branch
          # from an earlier failed run is the intended behaviour. main is never
          # touched — the bump reaches it only when the PR below is merged.
          git push --force -u origin "${RELEASE_BRANCH}"
          echo "Pushed ${RELEASE_BRANCH}."

      - name: Open the release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          set -euo pipefail

          # Build the PR body from a literal template (quoted heredoc, so the
          # markdown backticks stay literal and nothing shell-expands), then fill
          # in the placeholders with our already-validated release vars. The
          # values are `v?X.Y.Z` / digits, so they are safe in the sed RHS.
          cat > pr-body.template.md <<'EOF'
          ## Release __TAG__ (versionCode __VERSION_CODE__)

          Automated by the **Prepare release** workflow via `scripts/bump_version.py`.
          Merging this PR lands the version bump on `main` without pushing to the
          protected branch directly.

          ### What changed

          - **Version bump** — `app/pubspec.yaml` set to `version: __VERSION_NAME__+__VERSION_CODE__`. This is the single source of truth: Android's versionName/versionCode, the release tag, and the in-app About screen all follow it.
          - **Changelog update** — `CHANGELOG.md`: the `## Unreleased` section is rolled into `## __TAG__`, leaving a fresh `## Unreleased` placeholder.
          - **F-Droid metadata update** — `metadata/com.nexanote.app.yml`: a new build entry for __VERSION_NAME__ (versionCode __VERSION_CODE__, `commit: __TAG__`) plus refreshed `CurrentVersion` / `CurrentVersionCode` pointers.

          ### After merging

          Tag the merge commit `__TAG__` and push the tag to start the APK
          (`android-release.yml`) and Docker (`docker-publish.yml`) publish
          workflows:

          ```
          git tag __TAG__ <merge-commit> && git push origin __TAG__
          ```
          EOF

          sed \
            -e "s/__TAG__/${TAG}/g" \
            -e "s/__VERSION_NAME__/${VERSION_NAME}/g" \
            -e "s/__VERSION_CODE__/${VERSION_CODE}/g" \
            pr-body.template.md > pr-body.md

          title="chore: release ${TAG}"

          # Compare view a maintainer can open the PR from by hand if this
          # workflow isn't allowed to create one.
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${RELEASE_BRANCH}"

          # On a re-run the branch is force-pushed above; update the existing PR
          # instead of failing on "a pull request already exists".
          existing="$(gh pr list --head "${RELEASE_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${existing}" ]]; then
            gh pr edit "${existing}" --title "${title}" --body-file pr-body.md
            echo "Updated existing release PR #${existing} for ${RELEASE_BRANCH}."
          else
            # Some repositories disable "Allow GitHub Actions to create and
            # approve pull requests". With the default GITHUB_TOKEN, `gh pr
            # create` then fails with a specific GitHub message. The release
            # branch is already pushed at this point, so downgrade *that* failure
            # to a warning and tell the maintainer how to open the PR by hand.
            # Any other failure (and the RELEASE_PAT path) still fails the job.
            if create_output="$(gh pr create --base main --head "${RELEASE_BRANCH}" --title "${title}" --body-file pr-body.md 2>&1)"; then
              echo "${create_output}"
              echo "Opened release PR for ${RELEASE_BRANCH}."
            elif grep -qi "not permitted to create or approve pull requests" <<<"${create_output}"; then
              echo "${create_output}" >&2
              echo "::warning::GitHub Actions is not permitted to create pull requests in this repository; pushed the release branch without opening a PR."
              printf 'Release branch created successfully:\n%s\n\nOpen a PR manually:\n%s\n' \
                "${RELEASE_BRANCH}" "${compare_url}"
            else
              echo "${create_output}" >&2
              echo "::error::Failed to open the release pull request for ${RELEASE_BRANCH}."
              exit 1
            fi
          fi
