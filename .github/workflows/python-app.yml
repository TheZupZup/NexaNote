# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

  release-bump-guard:
    name: Release bump touches only version files
    runs-on: ubuntu-latest
    # Only meaningful for the version-bump PRs the "Prepare release" workflow
    # opens (it pushes a release/vX.Y.Z branch). github.head_ref is set only for
    # pull_request events, so this naturally skips pushes to main and every
    # non-release PR.
    if: ${{ startsWith(github.head_ref, 'release/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Diff the PR against its base and assert the changed files stay within the
      # version-bump allowlist (app/pubspec.yaml, the F-Droid metadata, and
      # CHANGELOG.md). Local twin: scripts/check_release_bump_files.sh.
      - name: Check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD \
            | ./scripts/check_release_bump_files.sh
