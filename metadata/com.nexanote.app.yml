AutoName: NexaNote
Summary: Self-hosted handwritten notes

Description: |
  NexaNote is a privacy-focused note-taking app for people who want to keep
  their notes on hardware they control. It pairs a Flutter Android client with
  a self-hosted Python (FastAPI) backend that stores everything as plain files
  on the user's own server or NAS.

  Features:

  * Markdown note storage — typed notes are saved as plain Markdown files.
  * Stylus and drawing support — handwritten notes with pen, highlighter,
    eraser, and pressure sensitivity.
  * Self-hosted backend over HTTP(S) on the user's own server, NAS, or
    private network.
  * WebDAV sync through the user's own WebDAV server.
  * Offline-first — local SQLite cache continues to work without network
    access, and syncs when one is available.

  The INTERNET permission is required so the app can reach the user's own
  backend and WebDAV server. No third-party servers, analytics, or trackers
  are contacted.

